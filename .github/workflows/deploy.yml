name: Deploy Jarvis

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "terraform/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Require AWS secrets
        id: aws
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ALLOW: ${{ secrets.ALLOW_TF_APPLY }}
        run: |
          if [ -z "$KEY" ] || [ -z "$SECRET" ]; then
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "Skipping Lambda deploy — AWS keys are not set."
          elif [ "$ALLOW" != "yes" ]; then
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "Skipping Terraform apply — local state is the source of truth."
            echo "Set secret ALLOW_TF_APPLY=yes only if a remote backend is configured."
          else
            echo "present=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.aws.outputs.present == 'yes'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.aws.outputs.present == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Terraform
        if: steps.aws.outputs.present == 'yes'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials
        if: steps.aws.outputs.present == 'yes'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Write .env for deployment
        if: steps.aws.outputs.present == 'yes'
        shell: bash
        run: |
          cat > .env <<EOF
          AWS_REGION=ap-south-1
          PROJECT_NAME=shreyo-agent
          TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
          ALLOWED_USER_ID=${{ secrets.ALLOWED_USER_ID }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GMAIL_TOKEN_JSON=
          GMAIL_CREDENTIALS_JSON=
          EOF

      - name: Install Python dependencies
        if: steps.aws.outputs.present == 'yes'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build and deploy
        if: steps.aws.outputs.present == 'yes'
        shell: bash
        run: |
          chmod +x scripts/*.sh
          ./scripts/deploy.sh
