<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis Growth OS</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Jarvis Growth OS</h1>
        <p>LaunchLayer content, approvals, and growth operations</p>
      </div>
      <div class="status-pill" id="api-status">Checking API</div>
    </header>

    <main>
      <section class="grid">
        <article class="card">
          <h2>Content pipeline</h2>
          <div class="stats">
            <div><span id="stat-draft">0</span><label>Draft</label></div>
            <div><span id="stat-pending">0</span><label>Awaiting approval</label></div>
            <div><span id="stat-approved">0</span><label>Approved</label></div>
            <div><span id="stat-scheduled">0</span><label>Scheduled</label></div>
          </div>
        </article>

        <article class="card">
          <h2>Create content</h2>
          <form id="content-form">
            <label>Campaign ID<input name="campaign_id" placeholder="camp_xxx" required /></label>
            <label>Channel
              <select name="channel">
                <option value="instagram">Instagram</option>
                <option value="linkedin">LinkedIn</option>
                <option value="newsletter">Newsletter</option>
                <option value="whatsapp">WhatsApp</option>
              </select>
            </label>
            <label>Type
              <select name="content_type">
                <option value="post">Post</option>
                <option value="carousel">Carousel</option>
                <option value="reel">Reel</option>
                <option value="newsletter">Newsletter</option>
              </select>
            </label>
            <label>Title<input name="title" required /></label>
            <label>Body<textarea name="body" rows="5" required></textarea></label>
            <button type="submit">Create draft</button>
          </form>
        </article>
      </section>

      <section class="card">
        <div class="section-header">
          <h2>Approval queue</h2>
          <button id="refresh">Refresh</button>
        </div>
        <div id="content-list" class="content-list">Loading…</div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
